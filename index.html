<style>
:root{
  --bg:#F8F7F4; --surface:#FFFFFF; --surface-2:#F1EFEA; --ink:#1D1B17; --muted:#6C675E; --line:#E3DFD6;
  --gold:#7A5F14; --gold-2:#C9AB4B; --gold-soft:#F4ECD5; --gray-art:#A9A9A9; --ok:#3F8A5A; --warn:#B7791F;
  --f-felicidad:#E9A80C; --f-tristeza:#3A6FD8; --f-temor:#8455D6; --f-incertidumbre:#16A79A; --f-enfado:#EA5435; --f-fuerza:#2EAD62; --f-debilidad:#B0709C;
  --d-felicidad:#976D07; --d-tristeza:#3A6FD8; --d-temor:#8455D6; --d-incertidumbre:#118379; --d-enfado:#CB492E; --d-fuerza:#23854B; --d-debilidad:#9A6289;
  --g-felicidad:linear-gradient(135deg,#F5B324,#E0870B); --g-tristeza:linear-gradient(135deg,#3E6FD9,#2446A6); --g-temor:linear-gradient(135deg,#7C55CF,#5A2EAE);
  --g-incertidumbre:linear-gradient(135deg,#118379,#0B6B63); --g-enfado:linear-gradient(135deg,#CB492E,#B52A16); --g-fuerza:linear-gradient(135deg,#23854B,#13753B); --g-debilidad:linear-gradient(135deg,#9A6289,#7A3D68);
  --lv-leve:#E5B300; --lv-moderado:#F07D12; --lv-fuerte:#DA3527;
  --display:"Cinzel","Trajan Pro",Georgia,serif; --body:"Jost","Avenir Next","Segoe UI",system-ui,sans-serif;
  --r:14px; --shadow:0 1px 2px rgba(30,25,15,.05),0 8px 24px rgba(30,25,15,.06);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12110F; --surface:#1B1A17; --surface-2:#25231F; --ink:#EEEBE4; --muted:#A39E93; --line:#36332D;
  --gold:#D8BC62; --gold-soft:#3A321F; --gray-art:#8E8E8E; --ok:#6DBB86; --warn:#E0A84A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12110F; --surface:#1B1A17; --surface-2:#25231F; --ink:#EEEBE4; --muted:#A39E93; --line:#36332D;
  --gold:#D8BC62; --gold-soft:#3A321F; --gray-art:#8E8E8E; --ok:#6DBB86; --warn:#E0A84A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);margin:0}
body{color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom,0px)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--gold-2);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance} p{margin:0}
.num{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}

.top{max-width:460px;margin:0 auto;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 6px;display:flex;align-items:center;gap:10px}
.top img{height:34px;width:auto}
.top .nm{font-family:var(--display);font-weight:700;font-size:16px;letter-spacing:.04em;line-height:1.05}
.top .sub{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold);font-weight:500}
.theme{margin-left:auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;width:40px;height:40px;display:grid;place-items:center;color:var(--muted)}
main{max-width:460px;margin:0 auto;padding:10px 16px 48px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.eyebrow{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:500}
.muted{color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 16px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px}
.btn.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.gold{background:var(--gold-2);border-color:var(--gold-2);color:#1D1B17}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.sm{min-height:38px;padding:7px 12px;font-size:14px;border-radius:10px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.full{width:100%}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:15px;line-height:1.2}
button.chip{min-height:40px}
button.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
.tag{font-size:13px;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.tag.ok{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.tag.gold{background:var(--gold-soft);color:var(--gold)}
textarea,input[type=text],input[type=date]{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:13px 14px;font-size:16px;resize:vertical}
textarea:focus,input:focus{outline:none;border-color:var(--gold-2);box-shadow:0 0 0 3px var(--gold-soft)}
.lbl{display:block;font-weight:500;margin-bottom:8px}

.scale{display:grid;gap:4px;--sl:var(--gold-2)}
.scale-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.scale-val{font-family:var(--display);font-size:28px;font-weight:600;color:var(--sl);min-width:3ch;text-align:right;transition:transform .15s}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:32px;background:transparent;--p:50%}
input[type=range]::-webkit-slider-runnable-track{height:10px;border-radius:99px;background:linear-gradient(90deg,var(--sl,var(--gold-2)) var(--p),var(--surface-2) var(--p));border:1px solid var(--line)}
input[type=range]::-moz-range-track{height:10px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line)}
input[type=range]::-moz-range-progress{height:10px;border-radius:99px;background:var(--sl,var(--gold-2))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:var(--surface);border:3px solid var(--sl,var(--gold-2));margin-top:-10px;box-shadow:var(--shadow)}
input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:var(--surface);border:3px solid var(--sl,var(--gold-2))}
.scale-ends{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}

svg.chart{width:100%;height:auto;display:block}
svg .grid{stroke:var(--line);stroke-width:1} svg .grid.faint{stroke-dasharray:2 4}
svg .ax{fill:var(--muted);font-size:13px;font-family:var(--body)} svg .val{font-size:13px;font-weight:600;font-family:var(--body)}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-size:15px;transition:.25s;z-index:60;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.toast b{color:var(--gold-2)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:70;width:100%;height:100%}
.calm{display:grid;place-items:center;margin:2px 0 4px}
.calm-c{width:176px;height:176px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,var(--gold-soft) 0 50%,color-mix(in srgb,var(--gold-2) 26%,transparent) 51% 68%,color-mix(in srgb,var(--gold-2) 10%,transparent) 69%);animation:breath 10s ease-in-out infinite}
.calm.sm .calm-c{width:128px;height:128px}
.calm-c span{grid-area:1/1;font-family:var(--display);font-size:21px;font-weight:600;text-align:center;line-height:1.15}
.calm-c small{display:block;font-family:var(--body);font-size:13px;font-weight:400;color:var(--muted)}
.calm.sm .calm-c span{font-size:17px}
.calm-c .in{animation:lin 10s infinite}.calm-c .out{opacity:0;animation:lout 10s infinite}.calm-c .still{display:none}
@keyframes breath{0%,100%{transform:scale(.8)}40%{transform:scale(1)}}
@keyframes lin{0%,36%{opacity:1}42%,96%{opacity:0}100%{opacity:1}}
@keyframes lout{0%,38%{opacity:0}44%,94%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.calm-c .in,.calm-c .out{display:none}.calm-c .still{display:block}}
.milestone{background:color-mix(in srgb,var(--f-fuerza) 12%,var(--surface));border-color:color-mix(in srgb,var(--f-fuerza) 35%,var(--line))}

/* home */
.hello{margin:6px 0 16px}
.hello h1{font-family:var(--display);font-size:28px;font-weight:600}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.stat{background:var(--surface-2);border-radius:14px;padding:10px 12px}
.stat b{display:block;font-family:var(--display);font-size:24px;font-weight:600;line-height:1.1}
.stat span{font-size:13px;color:var(--muted);line-height:1.2;display:block}
.hero-log{width:100%;text-align:left;border:0;border-radius:22px;padding:22px 20px;background:var(--ink);color:var(--bg);display:grid;gap:6px;position:relative;overflow:hidden;margin-bottom:8px;transition:transform .15s}
.hero-log:active{transform:scale(.98)}
.hero-log .t{font-family:var(--display);font-size:23px;font-weight:600}
.hero-log .s{opacity:.75;font-size:14px}
.hero-log svg{position:absolute;right:-6px;top:-4px;width:140px}
.hero-log .glow{animation:glow 3s ease-in-out infinite}
@keyframes glow{50%{opacity:.45}}
.quick{display:block;width:100%;text-align:center;margin-bottom:18px;font-size:15px}
.rainbow{display:flex;height:5px;border-radius:9px;overflow:hidden;margin:2px 0 4px;width:150px}
.rainbow i{flex:1}
.tiles{display:grid;gap:10px}
.tile{display:grid;grid-template-columns:46px 1fr auto;gap:12px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:18px;padding:14px;transition:transform .15s}
.tile:active{transform:scale(.98)}
.tile .ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;color:#fff}
.tile .t{font-weight:600} .tile .s{font-size:13px;color:var(--muted)} .tile .arrow{color:var(--muted)}
.fy{margin:0 0 16px}
.fy-head{display:flex;justify-content:space-between;align-items:baseline;margin:2px 0 8px}
.fy-head h3{font-size:16px}
.fy-track{display:grid;grid-auto-flow:column;grid-auto-columns:88%;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:2px 16px;scrollbar-width:none}
.fy-track.one{grid-auto-columns:100%}
.fy-track::-webkit-scrollbar{display:none}
.fy-slide{scroll-snap-align:center;display:grid}
.fy-card{border-radius:18px;padding:14px 16px;display:grid;gap:10px;align-content:start;background:var(--fy,var(--gold-soft))}
.fy-card .row{display:flex;gap:10px;align-items:center;justify-content:space-between}
.fy-card .from{display:flex;gap:8px;align-items:center;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:600}
.fy-card .from img{height:22px}
.fy-card .nota{font-size:16px;line-height:1.5;white-space:pre-wrap}
.fy-card ol{margin:0;padding-left:20px;display:grid;gap:4px;font-size:15px}
.fy-dots{display:flex;gap:6px;justify-content:center;margin-top:10px}
.fy-dots i{width:7px;height:7px;border-radius:9px;background:var(--line);transition:width .2s}
.fy-dots i.on{width:20px;background:var(--gold-2)}
.dock{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translate(-50%,120px);z-index:40;border:0;border-radius:999px;background:var(--ink);color:var(--bg);padding:13px 22px;font-weight:600;font-size:16px;box-shadow:0 10px 30px -10px rgba(0,0,0,.45);display:flex;gap:8px;align-items:center;transition:transform .25s,visibility .25s;white-space:nowrap;visibility:hidden}
.dock.on{transform:translate(-50%,0);visibility:visible}
body.dock-on .toast{bottom:calc(80px + env(safe-area-inset-bottom,0px))}
.pending{background:var(--gold-soft);border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}
.note-card{border-radius:18px;padding:16px;background:var(--gold-soft);display:grid;gap:8px;margin-bottom:14px}
.note-card .from{display:flex;gap:8px;align-items:center;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:600}
.note-card .from img{height:22px}
.note-card p{font-size:17px;line-height:1.5;white-space:pre-wrap}

/* flows */
.flow-head{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.progress{flex:1;display:flex;gap:6px}
.progress i{flex:1;height:5px;border-radius:9px;background:var(--surface-2);transition:background .3s}
.progress i.on{background:var(--gold-2)}
.flow h2{font-family:var(--display);font-size:25px;font-weight:600;margin-bottom:6px}
.flow .lead{color:var(--muted);margin-bottom:18px}
.flow .lead.instr{color:var(--ink);font-size:17px;background:var(--surface-2);border-left:3px solid var(--gold-2);border-radius:0 12px 12px 0;padding:12px 14px}
.blk{margin-bottom:20px}
.flow-foot{display:flex;gap:10px;margin-top:8px}
.flow-foot .btn{flex:1}
details.tip{background:var(--surface-2);border-radius:12px;padding:10px 14px;font-size:14px;margin-bottom:14px}
details.tip summary{cursor:pointer;color:var(--gold);font-weight:500}
details.tip p{margin-top:8px;color:var(--muted)}

.fams{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.fam{border:0;border-radius:18px;padding:14px;text-align:left;display:grid;gap:3px;position:relative;color:#fff;background:var(--fg);min-height:86px;box-shadow:0 6px 16px -8px var(--fc);transition:transform .15s, box-shadow .2s}
.fam:active{transform:scale(.96)}
.fam .n{font-weight:600;font-size:17px;text-shadow:0 1px 2px rgba(0,0,0,.15)}
.fam .w{font-size:13px;line-height:1.3}
.fam.light{color:#1D1B17}.fam.light .n{text-shadow:none}.fam.light .cnt{background:#1D1B17;color:#fff}
.fam[aria-expanded="true"]{box-shadow:0 0 0 3px var(--bg),0 0 0 6px var(--fc)}
.fam .cnt{position:absolute;right:10px;top:10px;background:#fff;color:var(--fd,var(--fc));font-size:13px;font-weight:700;border-radius:99px;min-width:24px;height:24px;display:grid;place-items:center;padding:0 7px;animation:pop .35s ease}
.fam.dim{filter:saturate(.55)}
.words{grid-column:1/-1;background:color-mix(in srgb,var(--fc) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--fc) 35%,transparent);border-radius:18px;padding:12px;animation:drop .25s ease}
@keyframes drop{from{opacity:.5;transform:translateY(-6px)}to{opacity:1;transform:none}}
.words .chip{background:var(--surface);border-color:color-mix(in srgb,var(--fc) 40%,var(--line));position:relative}
.words button.chip[aria-pressed="true"]{background:var(--fd,var(--fc));border-color:var(--fd,var(--fc));color:#fff;animation:pop .35s ease}
@keyframes pop{0%{transform:scale(.8)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
.spark{position:absolute;width:6px;height:6px;border-radius:50%;pointer-events:none;animation:spark .55s ease-out forwards}
@keyframes spark{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
.picked{display:flex;flex-wrap:wrap;gap:6px;min-height:32px}
.echip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 11px;font-size:14px;background:var(--fd,var(--fc));color:#fff;font-weight:500}
.words .chip.more{border-style:dashed;color:var(--muted)}
.words .hint{font-size:13px;color:var(--muted);margin:0 0 8px}
.body-chips button.chip[aria-pressed="true"]{background:var(--gold-2);border-color:var(--gold-2);color:#1D1B17}

.done-badge{display:grid;place-items:center;text-align:center;gap:8px;padding:6px 0 16px}
.done-badge svg{width:110px;height:110px}
.done-badge h2{font-family:var(--display);font-size:27px}
.insight{padding:16px;display:grid;gap:8px;margin-bottom:12px}
.insight .big{font-family:var(--display);font-size:21px;font-weight:600;line-height:1.3}
.meter{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;font-size:13px;color:var(--muted)}
.meter .bar{height:8px;background:var(--surface-2);border-radius:9px;overflow:hidden}
.meter .bar i{display:block;height:100%;background:var(--gold-2);border-radius:9px}
.meter b{color:var(--ink);font-variant-numeric:tabular-nums}

.rung{width:100%;text-align:left;display:grid;grid-template-columns:38px 1fr auto;gap:12px;align-items:center;padding:12px;border-radius:16px;border:1px solid var(--line);background:var(--surface);margin-bottom:8px}
.rung .k{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:600;background:var(--gold-soft);color:var(--gold)}
.rung.tried .k{background:var(--gold-2);color:#1D1B17}
.rung.lv{border-left:6px solid var(--lc)}
.rung.lv .k{background:var(--lc);color:#fff}
.lvtag{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--lc)}
.rung .x{font-size:15.5px;line-height:1.3}
.rung .su{font-size:13px;color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;gap:6px;align-items:center}
.area-row{display:grid;grid-template-columns:136px minmax(0,1fr) 46px;gap:10px;align-items:center}
.goal{padding:12px 0;border-top:1px solid var(--line);display:grid;gap:6px}
.goal-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.weeks{display:flex;gap:5px;align-items:center}
.weeks i{width:15px;height:15px;border-radius:4px;background:var(--surface-2);border:1px solid var(--line)}
.weeks i.on{background:var(--gold-2);border-color:var(--gold-2)}
.weeks i.now{outline:1.5px solid var(--gold-2);outline-offset:1px}
.toggle{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;white-space:nowrap;min-height:36px}
.toggle[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.goal-form{display:grid;gap:10px;background:var(--surface-2);border-radius:16px;padding:14px;margin-top:10px}
.linkish{border:0;background:none;color:var(--muted);font-size:13px;padding:4px;text-decoration:underline;text-underline-offset:3px}

.entry{width:100%;text-align:left;display:grid;gap:5px;padding:14px 0;border:0;border-top:1px solid var(--line);background:none}
.entry q{font-style:italic}
.alt-card{padding:16px;display:grid;gap:8px;margin-bottom:12px}
.alt-card .from{font-size:14px;color:var(--muted);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--muted) 50%,transparent)}
.alt-card .to{font-family:var(--display);font-size:19px;line-height:1.35}
.empty{padding:28px 18px;text-align:center;display:grid;gap:8px;justify-items:center}
.empty h3{font-family:var(--display);font-size:21px}
.loader{min-height:70vh;display:grid;place-items:center;text-align:center;gap:10px}
.loader img{height:64px;animation:breathe 1.6s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.08);opacity:.7}}
.ptable-wrap{overflow-x:auto;margin:0 -16px;padding:0 16px}
table.pt{border-collapse:collapse;min-width:820px;width:100%;font-size:14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
table.pt th{background:var(--gold-soft);text-align:left;vertical-align:bottom;padding:8px 9px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;border-bottom:2px solid var(--gold-2)}
table.pt th small{display:block;text-transform:none;letter-spacing:0;font-weight:500;color:var(--muted);font-size:12px}
table.pt td{padding:9px;border-bottom:1px solid var(--line);vertical-align:top;cursor:pointer}
table.pt tr:hover td{background:var(--surface-2)}
table.pt .echip{font-size:13px;padding:2px 8px;margin:0 3px 3px 0}
.npill{display:inline-block;min-width:28px;text-align:center;font-weight:700;font-size:13px;border-radius:6px;padding:1px 6px;background:var(--surface-2);margin-top:4px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:12px}
.seg button{border:0;background:var(--surface);padding:7px 14px;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.lect{padding:16px;display:grid;gap:8px;margin-bottom:12px}
.lect.done{opacity:.75}
.lect h3{font-size:17px}
.lect .nota{background:var(--gold-soft);border-radius:10px;padding:8px 10px;font-size:14px}
a.btn{text-decoration:none;color:inherit}
.section-t{margin:22px 0 8px;display:flex;justify-content:space-between;align-items:baseline}
.section-t h3{font-size:16px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script>
/* ================= conexión ================= */
var TOKEN = (document.getElementById('boot').getAttribute('data-token') || '').trim();
if (!/^[A-Za-z0-9_-]{20,}$/.test(TOKEN)) TOKEN = new URLSearchParams(location.search).get('p') || '';
var IN_GAS = typeof google !== 'undefined' && google.script && google.script.run;
/* En GitHub / app de inicio: recuerda el link en este celular por si la app se abre sin él. */
if (!IN_GAS) { try { if (TOKEN) localStorage.setItem('bitacora:token', TOKEN); else TOKEN = localStorage.getItem('bitacora:token') || ''; } catch (e) {} }
function api(action, data) {
  if (IN_GAS) return new Promise(function (res, rej) {
    google.script.run.withSuccessHandler(res).withFailureHandler(function (e) { rej(new Error(e && e.message ? e.message : String(e))); }).apiPaciente(TOKEN, action, data || null);
  });
  return fetch(window.BITACORA_API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ token: TOKEN, action: action, data: data || null }) })
    .then(function (r) { return r.json(); })
    .then(function (j) { if (!j.ok) throw new Error(j.error); return j.data; });
}

/* ================= utilidades ================= */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const store = {
  get(k, d) { try { const v = localStorage.getItem('bitacora:' + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('bitacora:' + k, JSON.stringify(v)); } catch (e) {} }
};
const DAY = 864e5;
const R = Math.round;
const avg = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;
const dayStart = d => { const x = new Date(d); x.setHours(0, 0, 0, 0); return x.getTime(); };
const daysAgo = iso => R((dayStart(Date.now()) - dayStart(iso)) / DAY);
const fmtD = iso => new Date(iso).toLocaleDateString('es-MX', { weekday: 'short', day: 'numeric', month: 'short' });
const fmtShort = iso => new Date(iso).toLocaleDateString('es-MX', { day: 'numeric', month: 'short' });
function weekKey(d) {
  d = new Date(d); const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const day = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - day);
  const y = t.getUTCFullYear(); const w = Math.ceil(((t - Date.UTC(y, 0, 1)) / DAY + 1) / 7);
  return y + '-W' + String(w).padStart(2, '0');
}

function buzz() { try { navigator.vibrate && navigator.vibrate(12); } catch (e) {} }
const firstName = n => String(n || '').split(' ')[0];

/* ================= emociones ================= */

}

  <h2>Tus números</h2>
  <div class="stats"><div class="stat"><b class="num">${regs().length}</b><span>registros</span></div><div class="stat"><b class="num">${D.exposiciones.length}</b><span>intentos de exposición</span></div><div class="stat"><b class="num">${goalsMonth}</b><span>metas cumplidas este mes</span></div></div>
  ${vb.length ? `<div class="card insight"><span class="eyebrow">Qué tanto crees tus pensamientos automáticos</span>${vb.length > 1 ? `<span class="big">De ${R(vb[0])} a ${R(vb[vb.length - 1])}</span>` : ''}
  ${lineSVG([{ vals: wb.vals, color: 'var(--gold-2)', area: true }, { vals: wi.vals, color: 'var(--gray-art)', dash: true, below: true }], wb.labels, { h: 220, label: 'Creencia e intensidad por semana' })}
  <div class="legend"><span><i class="dot" style="background:var(--gold-2)"></i>Creencia</span><span><i class="dot" style="background:var(--gray-art)"></i>Intensidad de la emoción</span></div></div>` : `<div class="card empty"><h3>Tus gráficas empiezan aquí</h3><p class="muted">Con unos cuantos registros verás cómo cambian tus números semana a semana.</p></div>`}
  ${fc.length ? `<div class="card insight"><span class="eyebrow">Lo que más has sentido</span>
  ${fc.map(([k, n]) => `<div class="meter" style="grid-template-columns:120px 1fr 24px"><span style="color:var(--ink)">${FAMS[k].n.split(' ')[0]}</span><span class="bar"><i style="width:${n / max * 100}%;background:${fgrad(k)}"></i></span><b>${n}</b></div>`).join('')}</div>` : ''}
  </div>`;
}

/* ================= render y eventos ================= */
function render() {
  const v = { lect: vLect, altemo: vAltEmo, altdone: vAltDone, home: vHome, abc: vAbc, quick: vQuick, done: vDone, list: vList, detail: vDetail, alts: vAlts, exp: vExp, expform: vExpForm, expdone: vExpDone, care: vCare, prog: vProg }[S.s] || vHome;
  $('#app').innerHTML = v();
  if (S.s === 'home') countUp();
  wireHome();
}
let heroObs = null;
function wireHome() {
  const dock = $('#dock'), hero = $('#heroLog');
  if (heroObs) { heroObs.disconnect(); heroObs = null; }
  const show = on => { dock.classList.toggle('on', on); document.body.classList.toggle('dock-on', on); };
  if (S.s !== 'home' || !hero || !('IntersectionObserver' in window)) { show(false); return; }
  const obs = new IntersectionObserver(es => { if (heroObs !== obs || S.s !== 'home' || !document.body.contains(hero)) return; show(!es[es.length - 1].isIntersecting); }, { threshold: 0 });
  heroObs = obs; obs.observe(hero);
  const tr = $('#fyTrack'), dots = $('#fyDots');
  if (tr && dots) tr.addEventListener('scroll', () => { const sl = tr.children; let best = 0, bd = 1e9; for (let i = 0; i < sl.length; i++) { const dd = Math.abs(sl[i].getBoundingClientRect().left - tr.getBoundingClientRect().left - 16); if (dd < bd) { bd = dd; best = i; } } [...dots.children].forEach((d, i) => d.classList.toggle('on', i === best)); }, { passive: true });
}
function go(s) { S.s = s; render(); window.scrollTo(0, 0); }
function countUp() {
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  document.querySelectorAll('[data-count]').forEach(el => { const n = +el.dataset.count; if (!n) return; let i = 0; const st = Math.max(1, Math.ceil(n / 18)); const t = setInterval(() => { i = Math.min(n, i + st); el.textContent = i; if (i >= n) clearInterval(t); }, 28); });
}
function syncDraft() {
  const d = S.draft; if (!d) return;
  const s = $('#f-sit'), t = $('#f-th'), dt = $('#f-date'), al = $('#f-alt');
  if (s) d.situacion = s.value; if (t) d.pensamiento = t.value; if (dt) d.fecha = dt.value; if (al) d.alternativo = al.value;
}
function fail(err) { S.saving = false; toast(esc(err && err.message || 'No se pudo guardar. Revisa tu conexión e intenta de nuevo.')); render(); }

document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act; syncDraft();
  switch (a) {
    case 'theme': { const t = store.get('theme', 'auto'); store.set('theme', t === 'auto' ? 'light' : t === 'light' ? 'dark' : 'auto'); applyTheme(); break; }
    case 'go': S.draft = null; S.care = null; S.goalEdit = null; go(el.dataset.s); break;
    case 'cancel': S.draft = null; go(S.editFrom || 'home'); break;
    case 'abc': S.draft = newDraft(); S.allW = {}; S.editFrom = 'home'; go('abc'); break;
    case 'quick': S.draft = newDraft(); go('quick'); break;
    case 'edit': { const e = D.registros.find(x => x.id === el.dataset.id); S.draft = newDraft(e); S.editFrom = S.s; go('abc'); break; }
    case 'detail': S.open = el.dataset.id; go('detail'); break;
    case 'next': {
      const d = S.draft;
      if (stepName(d) === 'sit' && d.cuando === 'Otro día' && !d.fechaOrig) {
        if (!d.fecha) { toast('Elige en el calendario qué día fue'); const f = $('#f-date'); if (f) { f.focus(); try { f.showPicker && f.showPicker(); } catch (e) {} } return; }
        if (d.fecha > hoyLocal()) { toast('La fecha no puede ser en el futuro'); return; }
      }
      if (stepOk(d)) { d.step++; go('abc'); }
      break;
    }
    case 'lview': store.set('listView', el.dataset.v); render(); break;
    case 'allw': { (S.allW ||= {})[el.dataset.g + el.dataset.k] = true; const y = window.scrollY; render(); window.scrollTo(0, y); break; }
    case 'installhide': store.set('installHidden', true); render(); break;
    case 'install': if (installEvt) { installEvt.prompt(); installEvt.userChoice.finally(() => { installEvt = null; render(); }); } break;
    case 'leido': {
      const l = D.lecturas.find(x => x.id === el.dataset.id), v = !l.leido;
      l.leido = v; render(); if (v) confetti(['#B0709C', '#C9AB4B', '#3A6FD8']);
      api('marcarLectura', { id: l.id, leido: v }).then(r => { if (r) Object.assign(l, r); render(); }).catch(e => { l.leido = !v; fail(e); });
      break;
    }
    case 'prev': { const d = S.draft; d.step = stepName(d) === 'rev' && altOn(d) && !d.alternativo.trim() ? stepsOf(d).indexOf('alt') : d.step - 1; go('abc'); break; }
    case 'skipalt': { const d = S.draft; d.alternativo = ''; d.emocionesAlt = {}; d.step = stepsOf(d).indexOf('rev'); go('abc'); break; }
    case 'dfam': buzz(); S.draft.openAlt = S.draft.openAlt === el.dataset.k ? null : el.dataset.k; { const y = window.scrollY; render(); window.scrollTo(0, y); } break;
    case 'dword': {
      const k = el.dataset.k, w = el.dataset.w, arr = (S.draft.emocionesAlt[k] ||= []), i = arr.indexOf(w);
      if (i < 0) arr.push(w); else arr.splice(i, 1);
      if (!arr.length) delete S.draft.emocionesAlt[k];
      buzz(); const y = window.scrollY; render(); window.scrollTo(0, y);
      if (i < 0) { const n = document.querySelector(`[data-act="dword"][data-k="${k}"][data-w="${CSS.escape(w)}"]`); if (n) sparkle(n, getComputedStyle(document.documentElement).getPropertyValue('--f-' + k)); }
      break;
    }
    case 'when': S.draft.cuando = el.dataset.v; S.draft.fechaOrig = null; if (el.dataset.v === 'Justo ahora' || el.dataset.v === 'Hoy más temprano') S.draft.momento = ''; render(); break;
    case 'mom': S.draft.momento = el.dataset.v; render(); break;
    case 'fam': buzz(); S.draft.open = S.draft.open === el.dataset.k ? null : el.dataset.k; render(); break;
    case 'word': {
      const k = el.dataset.k, w = el.dataset.w, arr = (S.draft.emociones[k] ||= []), i = arr.indexOf(w);
      if (i < 0) arr.push(w); else arr.splice(i, 1);
      if (!arr.length) delete S.draft.emociones[k];
      buzz(); const y = window.scrollY; render(); window.scrollTo(0, y);
      if (i < 0) { const n = document.querySelector(`[data-act="word"][data-k="${k}"][data-w="${CSS.escape(w)}"]`); if (n) sparkle(n, getComputedStyle(document.documentElement).getPropertyValue('--f-' + k)); }
      break;
    }
    case 'body': { const b = el.dataset.v, arr = S.draft.cuerpo, i = arr.indexOf(b); i < 0 ? arr.push(b) : arr.splice(i, 1); const y = window.scrollY; render(); window.scrollTo(0, y); break; }
    case 'qfam': buzz(); S.draft.familiaRapida = el.dataset.k; render(); break;
    case 'altemo': { const e = D.registros.find(x => x.id === el.dataset.id); S.aeFrom = S.s === 'home' ? 'home' : S.s === 'detail' ? 'detail' : 'alts'; S.open = e.id; S.ae = { id: e.id, emociones: JSON.parse(JSON.stringify(e.emocionesAlt || {})), open: null, intensidad: e.intensidadAlt ?? 50 }; go('altemo'); break; }
    case 'afam': buzz(); S.ae.open = S.ae.open === el.dataset.k ? null : el.dataset.k; { const y = window.scrollY; render(); window.scrollTo(0, y); } break;
    case 'aword': {
      const k = el.dataset.k, w = el.dataset.w, arr = (S.ae.emociones[k] ||= []), i = arr.indexOf(w);
      if (i < 0) arr.push(w); else arr.splice(i, 1);
      if (!arr.length) delete S.ae.emociones[k];
      buzz(); const y = window.scrollY; render(); window.scrollTo(0, y);
      if (i < 0) { const n = document.querySelector(`[data-act="aword"][data-k="${k}"][data-w="${CSS.escape(w)}"]`); if (n) sparkle(n, getComputedStyle(document.documentElement).getPropertyValue('--f-' + k)); }
      break;
    }
    case 'aesave': {
      if (S.saving) return; S.saving = true; render();
      api('responderAlternativo', { id: S.ae.id, emocionesAlt: S.ae.emociones, intensidadAlt: S.ae.intensidad }).then(r => {
        S.saving = false; D.registros = D.registros.filter(x => x.id !== r.id).concat(r); S.last = r; S.ae = null; go('altdone');
        confetti(['#2EAD62', '#16A79A', '#C9AB4B']);
      }).catch(fail);
      break;
    }
    case 'save': case 'qsave': {
      if (S.saving) return; const d = S.draft, quick = a === 'qsave';
      const f = computeFecha(d);
      const payload = { id: d.id, situacion: d.situacion, cuando: d.cuando, fechaEvento: f.fechaEvento, momento: f.momento, pensamiento: quick ? '' : d.pensamiento, creencia: d.creencia, emociones: quick ? {} : d.emociones, intensidad: d.intensidad, cuerpo: quick ? [] : d.cuerpo, rapido: quick, familiaRapida: quick ? d.familiaRapida : '' };
      if (!quick && altOn(d)) Object.assign(payload, { alternativo: d.alternativo.trim(), creenciaAlt: d.creenciaAlt, emocionesAlt: d.emocionesAlt, intensidadAlt: d.intensidadAlt });
      S.saving = true; render();
      api('guardarRegistro', payload).then(r => {
        S.saving = false; S.edited = !!d.id && !d.wasQuick;
        D.registros = D.registros.filter(x => x.id !== r.id).concat(r); S.last = r; S.draft = null;
        go('done'); if (!quick && isMilestone(r)) confetti(['#2EAD62', '#16A79A', '#C9AB4B']);
      }).catch(fail);
      break;
    }
    case 'expnew': S.x = { pasoId: el.dataset.id, antes: 50, durante: 60, despues: 30, nota: '' }; go('expform'); break;
    case 'expown': { const o = ownGroups()[+el.dataset.i]; if (!o) break; S.x = { pasoId: '', pasoTexto: o.texto, antes: 50, durante: 60, despues: 30, nota: '' }; go('expform'); break; }
    case 'expownnew': S.x = { pasoId: '', pasoTexto: '', nueva: true, antes: 50, durante: 60, despues: 30, nota: '' }; go('expform'); setTimeout(() => { const i = $('#xt-texto'); if (i) i.focus(); }, 30); break;
    case 'expsave': {
      if (S.saving) return; S.x.nota = ($('#x-nota') || {}).value || '';
      if (!S.x.pasoId) { const t = $('#xt-texto'); if (t) S.x.pasoTexto = t.value; if (!String(S.x.pasoTexto || '').trim()) { toast('Escribe a qué te expusiste'); if (t) t.focus(); return; } }
      S.saving = true; render();
      api('guardarExposicion', S.x).then(r => { S.saving = false; D.exposiciones.push(r); S.last = r; go('expdone'); confetti(); }).catch(fail);
      break;
    }
    case 'caresave': {
      if (S.saving) return; if (!AREAS.some(x => S.care[x.k] > 0)) { toast('Mueve al menos una barra antes de guardar'); return; }
      const c = S.care, tot = AREAS.reduce((s, x) => s + c[x.k], 0) || 1, payload = { semana: weekKey(Date.now()) };
      AREAS.forEach(x => payload[x.k] = R(c[x.k] / tot * 100)); S.saving = true; render();
      api('guardarAutocuidado', payload).then(r => { S.saving = false; D.autocuidado = D.autocuidado.filter(x => x.id !== r.id && x.semana !== r.semana).concat(r); S.care = null; toast('Tu semana quedó guardada'); render(); }).catch(fail);
      break;
    }
    case 'goal': {
      const id = el.dataset.id, wk = weekKey(Date.now()), hecho = !goalDone(id, wk);
      api('marcarMeta', { metaId: id, semana: wk, hecho }).then(r => { D.metasSemana = D.metasSemana.filter(x => x.id !== r.id).concat(r); if (hecho) { confetti(['#2EAD62', '#C9AB4B', '#16A79A']); toast('<b>¡Meta cumplida!</b> Sigue así.'); } render(); }).catch(fail);
      if (hecho) { el.setAttribute('aria-pressed', 'true'); el.textContent = 'Hecho'; }
      break;
    }
    case 'goalnew': S.goalEdit = { area: 'Personal', meta: '', como: '' }; render(); setTimeout(() => { const i = $('#g-meta'); if (i) i.focus(); }, 30); break;
    case 'goaledit': { const m = D.metas.find(x => x.id === el.dataset.id); S.goalEdit = { id: m.id, area: m.area, meta: m.meta, como: m.como }; render(); break; }
    case 'garea': S.goalEdit.meta = ($('#g-meta') || {}).value || ''; S.goalEdit.como = ($('#g-como') || {}).value || ''; S.goalEdit.area = el.dataset.v; render(); break;
    case 'gcancel': S.goalEdit = null; render(); break;
    case 'gsave': {
      const g = S.goalEdit; g.meta = $('#g-meta').value; g.como = $('#g-como').value;
      if (!g.meta.trim()) { toast('Escribe tu meta'); return; }
      S.saving = true; render();
      api('guardarMeta', g).then(r => { S.saving = false; D.metas = D.metas.filter(x => x.id !== r.id).concat(r); S.goalEdit = null; toast('Meta guardada'); render(); }).catch(fail);
      break;
    }
    case 'goaldel': {
      if (el.dataset.confirm !== '1') { el.dataset.confirm = '1'; el.textContent = '¿Seguro? Toca otra vez'; return; }
      api('borrarMeta', { id: el.dataset.id }).then(() => { D.metas = D.metas.filter(x => x.id !== el.dataset.id); render(); }).catch(fail);
      break;
    }
  }
});
document.addEventListener('input', ev => {
  const t = ev.target;
  if (t.matches('[data-scale]')) {
    t.style.setProperty('--p', t.value + '%'); const v = $('#' + t.id + '-v'); if (v) v.textContent = t.value;
    const d = S.draft;
    if (d && t.id === 'f-creencia') d.creencia = +t.value;
    if (d && t.id === 'f-int') d.intensidad = +t.value;
    if (S.ae && t.id === 'f-aint') S.ae.intensidad = +t.value;
    if (d && t.id === 'f-calt') d.creenciaAlt = +t.value;
    if (d && t.id === 'f-aint2') d.intensidadAlt = +t.value;
    if (S.x && t.id.startsWith('x-')) { S.x[t.id.slice(2)] = +t.value; $('#livecurve').innerHTML = curveSVG([S.x]); }
  }
  if (t.dataset.area) {
    S.care[t.dataset.area] = +t.value; t.style.setProperty('--p', t.value / 80 * 100 + '%');
    const c = S.care, tot = AREAS.reduce((a, x) => a + c[x.k], 0) || 1;
    AREAS.forEach(a => { const n = $('#ap-' + a.k); if (n) n.textContent = R(c[a.k] / tot * 100) + '%'; });
    $('#care-now').innerHTML = donutSVG(AREAS.map(a => c[a.k]), AREAS.map(a => a.c), 'Autocuidado');
    const b = $('#caresave'); if (b) { b.className = 'btn gold full'; b.textContent = 'Guardar mi semana'; }
  }
  if (S.draft && (t.id === 'f-sit' || t.id === 'f-th' || t.id === 'f-alt')) {
    syncDraft(); const b = $('#nextBtn');
    if (b) b.disabled = S.s === 'quick' ? !(S.draft.situacion.trim() && S.draft.familiaRapida) : !stepOk(S.draft);
  }
  if (S.draft && t.id === 'f-date') syncDraft();
});

document.addEventListener('change', ev => { if (S.draft && ev.target.id === 'f-date') syncDraft(); });

/* ================= arranque ================= */
applyTheme();
if (!TOKEN) {
  $('#app').innerHTML = `<div class="empty" style="margin-top:12vh"><h3>Este link está incompleto</h3><p class="muted">Abre el link completo que te mandó Ameyali.</p></div>`;
} else {
  api('init').then(d => { D = d; render(); }).catch(err => {
    $('#app').innerHTML = `<div class="empty" style="margin-top:12vh"><h3>No pude abrir tu bitácora</h3><p class="muted">${esc(err.message)}</p><button class="btn" onclick="location.reload()">Intentar de nuevo</button></div>`;
  });
}
</script>
